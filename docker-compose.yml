services:
  app:
    build: .
    restart: unless-stopped
    environment:
      WINDOW_HOURS: "5"
      REFRESH_SECONDS: "600"
      DASHBOARD_BACKGROUND: "1"
    volumes:
      - scrap_data:/app/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  scrap_data:
  caddy_data:
  caddy_config:
